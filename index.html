<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>息止めコーチング</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=DM+Mono:wght@400;500&display=swap');

:root {
–bg: #0d1b2a;
–surface: #112236;
–surface2: #1a3050;
–accent: #4fc3f7;
–success: #66bb6a;
–warning: #ffa726;
–danger: #ef5350;
–text: #e8f4fd;
–text-dim: #7fa8c9;
–border: rgba(79,195,247,0.2);
}

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘Noto Sans JP’, sans-serif;
background: var(–bg);
color: var(–text);
min-height: 100dvh;
display: flex;
flex-direction: column;
-webkit-tap-highlight-color: transparent;
overflow-x: hidden;
}

.header {
padding: 14px 20px 12px;
display: flex;
align-items: center;
gap: 10px;
border-bottom: 1px solid var(–border);
background: var(–surface);
}
.header-icon {
width: 36px; height: 36px;
background: linear-gradient(135deg, var(–accent), #0077b6);
border-radius: 10px;
display: flex; align-items: center; justify-content: center;
font-size: 18px;
}
.header-title { font-size: 16px; font-weight: 700; }
.header-sub { font-size: 11px; color: var(–text-dim); margin-top: 1px; }

main { flex: 1; display: flex; flex-direction: column; padding: 14px; gap: 12px; overflow-y: auto; }

/* ステータス */
.status-card {
background: var(–surface);
border-radius: 20px;
padding: 18px 20px;
border: 1px solid var(–border);
display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.phase-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: var(–text-dim); text-transform: uppercase; }
.phase-emoji { font-size: 34px; }
.phase-text { font-size: 38px; font-weight: 900; letter-spacing: -0.02em; transition: color 0.3s; }
.phase-text.idle   { color: var(–text-dim); }
.phase-text.detect { color: var(–warning); }
.phase-text.breath { color: var(–accent); }
.phase-text.hold   { color: var(–success); }

.cycle-row {
display: flex; align-items: center; gap: 6px; margin-top: 4px;
}
.cycle-dot {
width: 12px; height: 12px; border-radius: 50%;
background: var(–surface2);
border: 1.5px solid var(–border);
transition: background 0.3s, border-color 0.3s;
}
.cycle-dot.done { background: var(–accent); border-color: var(–accent); }
.cycle-dot.current { background: var(–warning); border-color: var(–warning); animation: blink 0.8s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.hold-timer-wrap { min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hold-timer { font-family: ‘DM Mono’, monospace; font-size: 48px; font-weight: 500; color: var(–success); }
.hold-timer-label { font-size: 11px; color: var(–text-dim); }

/* 波形 */
.wave-section {
background: var(–surface);
border-radius: 20px;
border: 1px solid var(–border);
padding: 12px 14px;
display: flex; flex-direction: column; gap: 8px;
}
.wave-header { display: flex; justify-content: space-between; align-items: center; }
.wave-title { font-size: 12px; color: var(–text-dim); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.wave-dot { width: 8px; height: 8px; border-radius: 50%; background: var(–text-dim); transition: background 0.3s; }
.wave-dot.active { background: var(–success); box-shadow: 0 0 8px var(–success); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
canvas { width: 100%; height: 140px; display: block; border-radius: 10px; background: var(–bg); }

/* 振幅スケール */
.scale-row {
display: flex; align-items: center; gap: 10px;
background: var(–surface); border-radius: 14px; padding: 10px 14px;
border: 1px solid var(–border);
}
.scale-label { font-size: 12px; color: var(–text-dim); white-space: nowrap; }
input[type=range] {
flex: 1; -webkit-appearance: none;
height: 4px; border-radius: 2px;
background: var(–surface2); outline: none;
}
input[type=range]::-webkit-slider-thumb {
-webkit-appearance: none;
width: 22px; height: 22px; border-radius: 50%;
background: var(–accent); cursor: pointer;
}
.scale-val { font-family: ‘DM Mono’, monospace; font-size: 13px; color: var(–accent); min-width: 48px; text-align: right; }

/* 統計 */
.stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.stat-card {
background: var(–surface); border: 1px solid var(–border);
border-radius: 16px; padding: 12px 8px; text-align: center;
}
.stat-value { font-family: ‘DM Mono’, monospace; font-size: 22px; font-weight: 500; color: var(–accent); line-height: 1; }
.stat-label { font-size: 10px; color: var(–text-dim); margin-top: 4px; }

/* ボタン */
.controls { display: flex; gap: 12px; }
.btn {
flex: 1; padding: 16px; border: none; border-radius: 16px;
font-family: ‘Noto Sans JP’, sans-serif; font-size: 15px; font-weight: 700;
cursor: pointer; transition: transform 0.1s, opacity 0.2s; letter-spacing: 0.04em;
}
.btn:active { transform: scale(0.96); }
.btn-start { background: linear-gradient(135deg, #0077b6, var(–accent)); color: #fff; }
.btn-stop { background: var(–surface2); color: var(–text-dim); border: 1px solid var(–border); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.notice { font-size: 10px; color: var(–text-dim); text-align: center; line-height: 1.6; padding-bottom: 8px; }

/* iOS modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: flex-end; z-index: 100; backdrop-filter: blur(4px); }
.modal-overlay.hidden { display: none; }
.modal { background: var(–surface); border-radius: 24px 24px 0 0; padding: 28px 24px 40px; width: 100%; border-top: 1px solid var(–border); }
.modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
.modal p { font-size: 14px; color: var(–text-dim); line-height: 1.7; margin-bottom: 24px; }
.modal-btn { width: 100%; padding: 18px; border: none; border-radius: 16px; background: linear-gradient(135deg, #0077b6, var(–accent)); color: #fff; font-family: ‘Noto Sans JP’, sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; }
</style>

</head>

  </div>

<script>
// ===================================================
// 定数
// ===================================================
const SAMPLE_HZ = 20;           // センサー更新頻度
const BUFFER_LEN = 300;         // 波形バッファ長（約15秒分）
const TARGET_CYCLES = 6;        // 何周期目で息止め合図

// ハイパスフィルタ定数（重力除去）
// カットオフ約0.05Hz → 呼吸(0.2-0.5Hz)を通し、重力(DC)をカット
const HP_ALPHA = 0.97;          // 高い値ほど低周波をよりカット

// ローパスフィルタ定数（高周波ノイズ除去）
const LP_ALPHA = 0.25;

// 息止め判定：この秒数以上静止で息止めとみなす
const HOLD_STILL_SEC = 0.6;
const HOLD_STILL_FRAMES = Math.round(HOLD_STILL_SEC * SAMPLE_HZ);

// ゼロクロス検出の最小間隔（誤検出防止）：0.5秒
const MIN_ZERO_CROSS_INTERVAL = Math.round(0.5 * SAMPLE_HZ);

// ===================================================
// 状態
// ===================================================
const st = {
  running: false,
  phase: 'idle',   // idle / detect / breath / hold
  holdStart: null,
  bestHold: null,
  holdCount: 0,
  totalHold: 0,
  cycleCount: 0,   // 完了した呼吸周期数
  scaleGain: 5,    // 表示スケール（スライダー値）
};

// フィルタ状態
let rawZ = 0;
let lpZ = 0;        // ローパス後
let hpZ = 0;        // ハイパス後（呼吸成分）
let hpPrev = 0;     // 前フレームのhpZ（ハイパス用）
let lpPrev = 0;     // 前フレームのlpZ

// 波形バッファ
const waveBuffer = new Float32Array(BUFFER_LEN);
let waveHead = 0;

// 周期検出
let zeroCrossCount = 0;     // ゼロクロス回数（2回 = 1周期）
let lastZeroCrossFrame = -999;
let prevSign = 0;           // 前フレームの符号
let framesSinceStart = 0;

// 息止め判定
let stillFrames = 0;
let holdActive = false;

// ベースライン収集（起動直後の数秒）
let baselineFrames = 0;
const BASELINE_REQUIRED = SAMPLE_HZ * 3; // 3秒

// TTS
let speakBusy = false;
let lastSpokenPhase = null;

// ===================================================
// UI要素
// ===================================================
const phaseText   = document.getElementById('phaseText');
const phaseEmoji  = document.getElementById('phaseEmoji');
const holdTimer   = document.getElementById('holdTimer');
const holdTimerLabel = document.getElementById('holdTimerLabel');
const waveDot     = document.getElementById('waveDot');
const statBest    = document.getElementById('statBest');
const statCount   = document.getElementById('statCount');
const statAvg     = document.getElementById('statAvg');
const btnStart    = document.getElementById('btnStart');
const btnStop     = document.getElementById('btnStop');
const scaleSlider = document.getElementById('scaleSlider');
const scaleVal    = document.getElementById('scaleVal');
const canvas      = document.getElementById('waveCanvas');
const ctx         = canvas.getContext('2d');

// 周期ドット
const dots = Array.from({length: 6}, (_, i) => document.getElementById(`dot${i}`));

// ===================================================
// スケールスライダー
// ===================================================
function updateScaleLabel(v) {
  const labels = {1:'最大',3:'大',5:'標準',8:'小',12:'極小',20:'最小'};
  // 最も近いラベルを探す
  let closest = '標準';
  let minDiff = 999;
  for (const [k, l] of Object.entries(labels)) {
    const d = Math.abs(v - Number(k));
    if (d < minDiff) { minDiff = d; closest = l; }
  }
  scaleVal.textContent = closest;
}
scaleSlider.addEventListener('input', () => {
  st.scaleGain = parseInt(scaleSlider.value);
  updateScaleLabel(st.scaleGain);
});
updateScaleLabel(5);

// ===================================================
// TTS
// ===================================================
function speak(text) {
  if (!window.speechSynthesis || speakBusy) return;
  speakBusy = true;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.9;
  u.onend = u.onerror = () => { speakBusy = false; };
  speechSynthesis.speak(u);
}

// ===================================================
// 周期ドット更新
// ===================================================
function updateDots(n) {
  // n: 完了済みサイクル数（0〜6）
  dots.forEach((d, i) => {
    d.classList.remove('done', 'current');
    if (i < n) d.classList.add('done');
    else if (i === n && n < TARGET_CYCLES) d.classList.add('current');
  });
}

// ===================================================
// フェーズ制御
// ===================================================
function setPhase(p) {
  if (st.phase === p) return;
  const prev = st.phase;
  st.phase = p;

  // 息止め終了
  if (prev === 'hold' && p !== 'hold' && st.holdStart !== null) {
    const dur = (Date.now() - st.holdStart) / 1000;
    if (dur >= 0.5) {
      st.holdCount++;
      st.totalHold += dur;
      if (st.bestHold === null || dur > st.bestHold) st.bestHold = dur;
      updateStats();
    }
    st.holdStart = null;
  }
  if (p === 'hold' && st.holdStart === null) {
    st.holdStart = Date.now();
  }

  const cfg = {
    idle:   { text: '待機中',     emoji: '😴', cls: 'idle'   },
    detect: { text: '計測中...',  emoji: '🔍', cls: 'detect' },
    breath: { text: '呼吸中',     emoji: '🌊', cls: 'breath' },
    hold:   { text: '止めて！',   emoji: '✋', cls: 'hold'   },
  }[p];
  phaseText.textContent = cfg.text;
  phaseText.className = `phase-text ${cfg.cls}`;
  phaseEmoji.textContent = cfg.emoji;

  const speechMap = { breath: '呼吸を続けてください', hold: '止めてください' };
  if (speechMap[p] && p !== lastSpokenPhase) {
    speak(speechMap[p]);
    lastSpokenPhase = p;
  }
  if (p === 'idle' || p === 'detect') lastSpokenPhase = null;
}

function updateStats() {
  statCount.textContent = st.holdCount;
  if (st.bestHold !== null) statBest.textContent = st.bestHold.toFixed(1);
  if (st.holdCount > 0) statAvg.textContent = (st.totalHold / st.holdCount).toFixed(1);
}

// ===================================================
// センサーイベント処理
// ===================================================
function onMotion(e) {
  if (!st.running) return;
  const acc = e.accelerationIncludingGravity || e.acceleration;
  if (!acc) return;

  rawZ = acc.z ?? 0;
  framesSinceStart++;

  // --- ローパスフィルタ（ノイズ除去）---
  lpZ = LP_ALPHA * rawZ + (1 - LP_ALPHA) * lpPrev;
  lpPrev = lpZ;

  // --- ハイパスフィルタ（重力・DCオフセット除去）---
  hpZ = HP_ALPHA * (hpPrev + lpZ - lpPrev);
  // 注意：lpPrevはすでに更新済みなのでlpZ_prevを別途保持
  // 正確なHPF実装：
  // hpZ[n] = alpha * (hpZ[n-1] + x[n] - x[n-1])
  // ここではlpZを入力とする
  hpPrev = hpZ;

  // 波形バッファへ
  waveBuffer[waveHead] = hpZ;
  waveHead = (waveHead + 1) % BUFFER_LEN;

  // ベースライン収集中
  if (baselineFrames < BASELINE_REQUIRED) {
    baselineFrames++;
    if (baselineFrames === BASELINE_REQUIRED) {
      setPhase('breath');
      // 周期カウントリセット
      zeroCrossCount = 0;
      st.cycleCount = 0;
      prevSign = Math.sign(hpZ);
      updateDots(0);
      speak('呼吸を始めてください。6回呼吸したら止めます。');
    }
    return;
  }

  // === 呼吸中フェーズのみ周期カウント ===
  if (st.phase === 'breath') {
    const curSign = hpZ > 0 ? 1 : (hpZ < 0 ? -1 : 0);

    // ゼロクロス検出（負→正：吸気開始、正→負：呼気開始）
    if (curSign !== 0 && prevSign !== 0 && curSign !== prevSign) {
      const framesSinceLastCross = framesSinceStart - lastZeroCrossFrame;
      if (framesSinceLastCross > MIN_ZERO_CROSS_INTERVAL) {
        zeroCrossCount++;
        lastZeroCrossFrame = framesSinceStart;

        // ゼロクロス2回 = 1周期
        if (zeroCrossCount % 2 === 0) {
          st.cycleCount++;
          updateDots(st.cycleCount);

          if (st.cycleCount < TARGET_CYCLES) {
            // 残りサイクルをアナウンス
            const remaining = TARGET_CYCLES - st.cycleCount;
            if (remaining <= 2) speak(`あと${remaining}回`);
          } else {
            // 6周期完了 → 次の呼気谷（負→正クロス）で止める
            // ここでは即座に合図（次の呼気タイミング）
            triggerHold();
          }
        }
      }
    }
    if (curSign !== 0) prevSign = curSign;

    // 息止め判定（動きが止まったか）
    const motionMag = Math.abs(hpZ);
    if (motionMag < 0.02) {
      stillFrames++;
    } else {
      stillFrames = 0;
    }
  }

  // 息止め中：動き再開を検出して解除
  if (st.phase === 'hold') {
    const motionMag = Math.abs(hpZ);
    if (motionMag > 0.04) {
      // 息止め解除→再度カウントへ
      st.cycleCount = 0;
      zeroCrossCount = 0;
      prevSign = Math.sign(hpZ);
      stillFrames = 0;
      updateDots(0);
      setPhase('breath');
      speak('息を吸ってください。また6回呼吸します。');
    }
  }
}

function triggerHold() {
  speak('止めてください');
  lastSpokenPhase = 'hold';
  setPhase('hold');
  stillFrames = 0;
  updateDots(TARGET_CYCLES);
}

// ===================================================
// ハイパスフィルタ（正確な実装）
// ===================================================
let hpX_prev = 0;   // 入力の前の値
let hpY_prev = 0;   // 出力の前の値

function highpass(x) {
  const y = HP_ALPHA * (hpY_prev + x - hpX_prev);
  hpX_prev = x;
  hpY_prev = y;
  return y;
}

let lpX_prev = 0;
function lowpass(x) {
  const y = LP_ALPHA * x + (1 - LP_ALPHA) * lpX_prev;
  lpX_prev = y;
  return y;
}

// onMotionを正しいフィルタ実装で上書き
function onMotionFiltered(e) {
  if (!st.running) return;
  const acc = e.accelerationIncludingGravity || e.acceleration;
  if (!acc) return;

  rawZ = acc.z ?? 0;
  framesSinceStart++;

  // ローパス → ハイパスの順でフィルタ
  const lp = lowpass(rawZ);
  const hp = highpass(lp);

  // 波形バッファ
  waveBuffer[waveHead] = hp;
  waveHead = (waveHead + 1) % BUFFER_LEN;

  // ベースライン収集中
  if (baselineFrames < BASELINE_REQUIRED) {
    baselineFrames++;
    if (baselineFrames === BASELINE_REQUIRED) {
      setPhase('breath');
      zeroCrossCount = 0;
      st.cycleCount = 0;
      prevSign = Math.sign(hp);
      updateDots(0);
      speak('呼吸を始めてください。6回呼吸したら止めます。');
    }
    return;
  }

  if (st.phase === 'breath') {
    const curSign = hp > 0.005 ? 1 : (hp < -0.005 ? -1 : 0); // デッドゾーン
    if (curSign !== 0 && prevSign !== 0 && curSign !== prevSign) {
      const interval = framesSinceStart - lastZeroCrossFrame;
      if (interval > MIN_ZERO_CROSS_INTERVAL) {
        zeroCrossCount++;
        lastZeroCrossFrame = framesSinceStart;

        if (zeroCrossCount % 2 === 0) {
          st.cycleCount++;
          updateDots(st.cycleCount);
          const remaining = TARGET_CYCLES - st.cycleCount;
          if (remaining > 0 && remaining <= 2) {
            speak(`あと${remaining}回`);
          } else if (remaining === 0) {
            triggerHold();
          }
        }
      }
    }
    if (curSign !== 0) prevSign = curSign;
  }

  if (st.phase === 'hold') {
    const mag = Math.abs(hp);
    if (mag > 0.04) {
      st.cycleCount = 0;
      zeroCrossCount = 0;
      prevSign = Math.sign(hp);
      stillFrames = 0;
      updateDots(0);
      setPhase('breath');
      speak('息を吸ってください。また6回呼吸します。');
    }
  }
}

// ===================================================
// 波形描画
// ===================================================
let rafId = null;

function resizeCanvas() {
  const pr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth - 28;
  canvas.width = w * pr;
  canvas.height = 140 * pr;
  canvas.style.width = w + 'px';
  canvas.style.height = '140px';
}

function drawWave() {
  resizeCanvas();
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // グリッド線（中心±振幅目安）
  ctx.strokeStyle = 'rgba(79,195,247,0.08)';
  ctx.lineWidth = 1;
  [0.25, 0.5, 0.75].forEach(r => {
    const y = H * r;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  });

  // 波形
  const scaleY = (H / 2) / (0.1 / st.scaleGain * 10); // スケール調整
  const isHold = st.phase === 'hold';
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, isHold ? '#66bb6a' : '#4fc3f7');
  grad.addColorStop(1, isHold ? '#2e7d32' : '#0077b6');

  ctx.beginPath();
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2.5 * (window.devicePixelRatio || 1);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  for (let i = 0; i < BUFFER_LEN; i++) {
    const idx = (waveHead + i) % BUFFER_LEN;
    const x = (i / (BUFFER_LEN - 1)) * W;
    const y = H / 2 - waveBuffer[idx] * scaleY;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // 中心線
  ctx.strokeStyle = 'rgba(79,195,247,0.18)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();
  ctx.setLineDash([]);
}

function loop() {
  // ホールドタイマー更新
  if (st.phase === 'hold' && st.holdStart) {
    const el = (Date.now() - st.holdStart) / 1000;
    holdTimer.style.display = '';
    holdTimer.textContent = el.toFixed(1);
    holdTimerLabel.textContent = '息止め継続中';
  } else {
    holdTimer.style.display = 'none';
    holdTimerLabel.textContent = '';
  }
  drawWave();
  rafId = requestAnimationFrame(loop);
}

// ===================================================
// 開始・停止
// ===================================================
function startSession() {
  // 全リセット
  waveBuffer.fill(0); waveHead = 0;
  rawZ = lpZ = hpZ = hpPrev = lpPrev = 0;
  hpX_prev = hpY_prev = lpX_prev = 0;
  prevSign = 0;
  zeroCrossCount = 0; lastZeroCrossFrame = -999;
  framesSinceStart = 0;
  stillFrames = 0;
  baselineFrames = 0;
  st.holdStart = null;
  st.cycleCount = 0;
  lastSpokenPhase = null;
  speakBusy = false;
  updateDots(0);

  st.running = true;
  st.phase = 'detect';
  phaseText.textContent = '計測中...';
  phaseText.className = 'phase-text detect';
  phaseEmoji.textContent = '🔍';
  waveDot.classList.add('active');
  btnStart.disabled = true;
  btnStop.disabled = false;

  window.addEventListener('devicemotion', onMotionFiltered);
  loop();
  speak('センサーを起動します。スマートフォンをお腹の上に置いて静かにしてください。');
}

function stopSession() {
  st.running = false;
  window.removeEventListener('devicemotion', onMotionFiltered);
  setPhase('idle');
  waveDot.classList.remove('active');
  btnStart.disabled = false;
  btnStop.disabled = true;
  updateDots(0);
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  speak('セッションを終了します');
}

btnStart.addEventListener('click', () => {
  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission()
      .then(p => { if (p === 'granted') startSession(); else alert('センサーの許可が必要です'); })
      .catch(console.error);
  } else {
    startSession();
  }
});
btnStop.addEventListener('click', stopSession);

// iOS modal
const iosModal = document.getElementById('iosModal');
const iosPermBtn = document.getElementById('iosPermBtn');
if (typeof DeviceMotionEvent !== 'undefined' &&
    typeof DeviceMotionEvent.requestPermission === 'function') {
  iosModal.classList.remove('hidden');
}
iosPermBtn.addEventListener('click', () => {
  DeviceMotionEvent.requestPermission()
    .then(() => iosModal.classList.add('hidden'))
    .catch(() => iosModal.classList.add('hidden'));
});

drawWave();
</script>

</body>
